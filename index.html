<!doctype html>
<html lang="en" class="rp-shell-booting">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#020306" />
  <meta name="description" content="Real Play Basketball — a real-world basketball movement and player platform. Less Screen. Real Points." />
  <title>Real Play Basketball — Less Screen. Real Points.</title>
  <style id="rp-shell-static-boot-gate">
    *{box-sizing:border-box}
    html{background:#020306}
    body{margin:0;min-width:320px;min-height:100dvh;background:#020306;color:#f7f9fc;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
    button,a{-webkit-tap-highlight-color:transparent}
    button{font:inherit}
    img,svg{display:block;max-width:100%}

    html.rp-shell-booting body{overflow:hidden!important;pointer-events:none!important;user-select:none!important}
    html.rp-shell-booting body>*{visibility:hidden!important;pointer-events:none!important}
    html.rp-shell-booting body::before,
    html.rp-shell-booting body::after{position:fixed;left:50%;z-index:2147483647;visibility:visible!important;pointer-events:none;transform:translateX(-50%);text-align:center}
    html.rp-shell-booting body::before{content:'REAL PLAY';top:45%;color:#f6f9ff;font-family:Impact,'Arial Narrow',Arial,sans-serif;font-size:clamp(2rem,9vw,3.25rem);font-style:italic;font-weight:950;letter-spacing:.025em;white-space:nowrap}
    html.rp-shell-booting:not(.rp-shell-failed) body::after{content:'BASKETBALL  ·  LOADING\A\A APPLYING THE LATEST UPDATES\A This may take a little longer than usual.\A Thank you for your patience.';top:calc(45% + 58px);width:min(86vw,380px);color:#42d8ff;font-family:Arial,sans-serif;font-size:.56rem;font-weight:900;letter-spacing:.10em;line-height:1.7;white-space:pre-line;animation:rpStaticBootPulse 1.1s ease-in-out infinite alternate}
    html.rp-shell-booting.rp-shell-failed body::before,
    html.rp-shell-booting.rp-shell-failed body::after{display:none!important}
    @keyframes rpStaticBootPulse{from{opacity:.38}to{opacity:1}}
    @media(prefers-reduced-motion:reduce){html.rp-shell-booting body::after{animation:none!important;opacity:.78}}

    .rp-static-failure{display:none}
    html.rp-shell-booting.rp-shell-failed .rp-static-failure{position:fixed;inset:0;z-index:2147483647;display:grid!important;place-items:center;visibility:visible!important;pointer-events:auto!important;padding:24px;background:#020306}
    .rp-static-failure-card{width:min(100%,420px);padding:28px 24px;border:1px solid rgba(255,123,140,.24);border-radius:20px;background:linear-gradient(155deg,#080c13,#03060b);box-shadow:0 28px 80px rgba(0,0,0,.55);text-align:center}
    .rp-static-failure-card small{display:block;color:#ff7b8c;font-size:.58rem;font-weight:900;letter-spacing:.16em}
    .rp-static-failure-card strong{display:block;margin:9px 0 10px;color:#f7fbff;font-family:Impact,'Arial Narrow',Arial,sans-serif;font-size:2rem;font-style:italic;letter-spacing:.02em}
    .rp-static-failure-card p{margin:0;color:#8293a6;font-size:.76rem;line-height:1.55}
    .rp-static-failure-card button{width:100%;min-height:48px;margin-top:18px;border:1px solid rgba(66,216,255,.34);border-radius:12px;color:#031018;background:linear-gradient(135deg,#6be4ff,#35c8f4);font-size:.7rem;font-weight:950;letter-spacing:.09em;cursor:pointer}
  </style>
  <script>window.__rpStaticBootFallback=setTimeout(function(){document.documentElement.classList.add('rp-shell-failed')},8000);</script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="manifest" href="site.webmanifest?v=20260923-current-shell-v1" />
  <link rel="stylesheet" href="auth.css?v=20260923-startup-stability-v1" />
  <script src="startup-preload.js?v=20260924-home-first-v2" defer></script>
  <script src="auth-shell.js?v=20260923-phase3-auth-shell-v2" defer></script>
  <script src="post-reveal-extras.js?v=20260924-post-reveal-extras-v1" defer></script>
  <script src="app.js?v=20260924-home-first-v121" defer></script>
  <script src="auth.js?v=20260923-auth-runtime-v2" defer></script>
  <script src="ranking-reservation-snapshot-standby-fit.js?v=20260918-snapshot-standby-fit-v98" defer></script>
</head>
<body>
  <div class="rp-static-failure" role="alert" aria-live="assertive">
    <section class="rp-static-failure-card">
      <small>REAL PLAY BASKETBALL</small>
      <strong>LOAD FAILED.</strong>
      <p>The current Real Play app could not finish loading. Refresh to try again.</p>
      <button type="button" onclick="window.location.reload()">REFRESH REAL PLAY</button>
    </section>
  </div>
</body>
</html>
