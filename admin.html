<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Real Play — Head Admin</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root{color-scheme:dark;--bg:#020712;--panel:#07111f;--line:rgba(90,188,255,.18);--text:#f6fbff;--muted:#7f93aa;--cyan:#1ddcff;--blue:#176cff}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:radial-gradient(circle at 50% 0,rgba(23,108,255,.16),transparent 32%),var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(100%,420px)}
    .brand{display:flex;align-items:center;gap:12px;margin-bottom:34px}
    .logo{width:50px;height:50px;border:1px solid rgba(29,220,255,.45);border-radius:16px;display:grid;place-items:center;background:#061426;font-weight:950;font-style:italic;letter-spacing:-.08em}
    .brand strong{display:block;font-size:.92rem;letter-spacing:.12em}
    .brand span{display:block;margin-top:4px;color:var(--muted);font-size:.62rem;font-weight:800;letter-spacing:.16em}
    .eyebrow{color:var(--cyan);font-size:.65rem;font-weight:900;letter-spacing:.16em}
    h1{margin:8px 0 9px;font-size:2.15rem;line-height:.95;letter-spacing:-.04em;font-style:italic}
    .lead{margin:0 0 24px;color:var(--muted);font-size:.86rem;line-height:1.55}
    .card{padding:20px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,rgba(10,24,44,.94),rgba(5,11,20,.96));box-shadow:0 22px 70px rgba(0,0,0,.35)}
    label{display:block;margin-bottom:14px;color:#aab9ca;font-size:.69rem;font-weight:850;letter-spacing:.09em}
    input{width:100%;min-height:50px;margin-top:7px;padding:0 14px;border:1px solid rgba(128,183,239,.16);border-radius:14px;background:#040b14;color:#fff;font:inherit;outline:none}
    input:focus{border-color:rgba(29,220,255,.55);box-shadow:0 0 0 3px rgba(29,220,255,.08)}
    input[readonly]{color:#a9dfff;background:#06111f}
    button{width:100%;min-height:52px;border:0;border-radius:15px;color:white;background:linear-gradient(105deg,var(--blue),#167cff 58%,var(--cyan));font:inherit;font-weight:950;font-style:italic;letter-spacing:.09em;cursor:pointer}
    button:disabled{opacity:.55;cursor:wait}
    .status{min-height:20px;margin:12px 2px 0;color:var(--muted);font-size:.76rem;line-height:1.4}
    .status.error{color:#ff8f99}.status.success{color:#63f5c0}
    .foot{margin-top:18px;text-align:center;color:#52667d;font-size:.61rem;font-weight:800;letter-spacing:.12em;line-height:1.6}
    .back{display:inline-block;margin-top:18px;color:#8da1b7;text-decoration:none;font-size:.72rem;font-weight:800}
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <div class="logo">RP</div>
      <div><strong>REAL PLAY BASKETBALL</strong><span>OPERATIONS ACCESS</span></div>
    </div>

    <div class="eyebrow">HEAD ADMIN</div>
    <h1>GAME CONTROL</h1>
    <p class="lead">Sign in to control Beta Career sessions, confirmed players, teams, live scoring, player stats, and final results.</p>

    <section class="card">
      <form id="admin-login">
        <label>HEAD ADMIN EMAIL
          <input id="admin-email" type="email" value="jeromemirabuenos62@gmail.com" readonly autocomplete="username">
        </label>
        <label>PASSWORD
          <input id="admin-password" type="password" required autocomplete="current-password" placeholder="Enter your Real Play password">
        </label>
        <button id="admin-submit" type="submit">ENTER GAME CONTROL</button>
        <div id="admin-status" class="status" role="status" aria-live="polite"></div>
      </form>
    </section>

    <a class="back" href="./">← BACK TO REAL PLAY</a>
    <div class="foot">HEAD ADMIN ACCESS IS VERIFIED BY THE REAL PLAY BACKEND.<br>NO ADMIN PASSWORD IS STORED IN THIS PAGE.</div>
  </main>

  <script>
    (() => {
      const API_BASE_URL = 'https://api.clarapmc.com';
      const TOKEN_KEY = 'real_play_access_token';
      const form = document.getElementById('admin-login');
      const email = document.getElementById('admin-email');
      const password = document.getElementById('admin-password');
      const submit = document.getElementById('admin-submit');
      const status = document.getElementById('admin-status');

      function setStatus(message, type='') {
        status.textContent = message || '';
        status.className = `status${type ? ` ${type}` : ''}`;
      }

      async function verifyAdmin(token) {
        const response = await fetch(`${API_BASE_URL}/api/real-play/admin/career/control`, {
          headers: { Accept: 'application/json', Authorization: `Bearer ${token}` },
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || !data?.admin) {
          throw new Error(data?.message || 'This account is not authorized as Real Play Head Admin.');
        }
        return data;
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        submit.disabled = true;
        submit.textContent = 'VERIFYING…';
        setStatus('');
        try {
          const response = await fetch(`${API_BASE_URL}/api/real-play/auth/login`, {
            method: 'POST',
            headers: { Accept: 'application/json', 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email.value.trim(), password: password.value }),
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok || !data?.token) {
            throw new Error(data?.message || 'Unable to sign in.');
          }
          await verifyAdmin(data.token);
          localStorage.setItem(TOKEN_KEY, data.token);
          setStatus('Head Admin verified. Opening Game Control…', 'success');
          window.setTimeout(() => { window.location.href = './?admin=1'; }, 250);
        } catch (error) {
          localStorage.removeItem(TOKEN_KEY);
          setStatus(error.message || 'Admin login failed.', 'error');
          password.focus();
        } finally {
          submit.disabled = false;
          submit.textContent = 'ENTER GAME CONTROL';
        }
      });

      const existing = localStorage.getItem(TOKEN_KEY);
      if (existing) {
        verifyAdmin(existing)
          .then(() => setStatus('Head Admin session already active. You can sign in again or return to Real Play.', 'success'))
          .catch(() => localStorage.removeItem(TOKEN_KEY));
      }
    })();
  </script>
</body>
</html>
