<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Real Play — Head Admin</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,700;0,800;0,900;1,800;1,900&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      color-scheme:dark;
      --bg:#020204;
      --panel:#07090d;
      --line:rgba(201,206,214,.15);
      --text:#f7f8fa;
      --silver:#c9ced6;
      --muted:#87919f;
      --blue:#086cff;
      --blue-hi:#18a9ff;
      --red:#ff2028;
      --display:'Barlow Condensed',Impact,'Arial Narrow',sans-serif;
      --body:Inter,system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;color:var(--text);font-family:var(--body)}
    body{
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
      background:
        radial-gradient(75% 52% at -12% 8%,rgba(8,108,255,.20),transparent 72%),
        radial-gradient(62% 46% at 112% 38%,rgba(255,32,40,.11),transparent 74%),
        linear-gradient(180deg,#030407 0%,#020204 55%,#040507 100%);
    }
    main{width:min(100%,430px)}
    .brand{margin-bottom:32px;text-align:center}
    .brand strong{
      display:block;
      color:#fff;
      font:italic 900 clamp(2.4rem,10vw,3.4rem)/.86 var(--display);
      letter-spacing:-.045em;
    }
    .brand span{
      display:block;
      margin-top:8px;
      color:var(--blue-hi);
      font:900 .9rem/1 var(--display);
      letter-spacing:.23em;
    }
    .brand::after{
      content:'';
      display:block;
      width:56px;
      height:2px;
      margin:15px auto 0;
      background:linear-gradient(90deg,var(--blue) 0 82%,var(--red) 82% 100%);
    }
    .eyebrow{color:var(--blue-hi);font:900 .78rem/1 var(--display);letter-spacing:.13em}
    h1{margin:8px 0 10px;color:#fff;font:italic 900 2.45rem/.9 var(--display);letter-spacing:-.035em}
    .lead{margin:0 0 20px;color:#a4adba;font-size:.94rem;line-height:1.55}
    .card{
      position:relative;
      overflow:hidden;
      padding:20px;
      border:1px solid var(--line);
      border-radius:17px;
      background:linear-gradient(155deg,rgba(10,13,18,.97),rgba(4,5,7,.99));
      box-shadow:0 24px 70px rgba(0,0,0,.46);
    }
    .card::before{
      content:'';
      position:absolute;
      left:18px;right:18px;top:0;height:2px;
      background:linear-gradient(90deg,var(--blue) 0 82%,var(--red) 82% 100%);
    }
    label{display:block;margin-bottom:15px;color:#c1c8d1;font-size:.76rem;font-weight:850;letter-spacing:.07em}
    input{
      width:100%;
      min-height:52px;
      margin-top:8px;
      padding:0 14px;
      border:1px solid rgba(201,206,214,.15);
      border-radius:10px;
      background:#020307;
      color:#fff;
      font:inherit;
      outline:none;
    }
    input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(8,108,255,.09)}
    input[readonly]{color:#9fb2c6;background:#05070a}
    button{
      position:relative;
      overflow:hidden;
      width:100%;
      min-height:54px;
      border:1px solid rgba(255,255,255,.82);
      border-radius:12px;
      color:#07090d;
      background:linear-gradient(180deg,#fff,#e6e9ed);
      font:italic 900 .94rem/1 var(--display);
      letter-spacing:.08em;
      cursor:pointer;
      box-shadow:0 14px 32px rgba(0,0,0,.28);
    }
    button::after{content:'';position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--blue) 0 82%,var(--red) 82% 100%)}
    button:disabled{opacity:.55;cursor:wait}
    .status{min-height:20px;margin:12px 2px 0;color:var(--muted);font-size:.78rem;line-height:1.4}
    .status.error{color:#ff7883}
    .status.success{color:#5ebcff}
    .foot{margin-top:18px;text-align:center;color:#5f6875;font-size:.65rem;font-weight:800;letter-spacing:.1em;line-height:1.55}
    .back{display:inline-block;margin-top:18px;color:#9aa4b1;text-decoration:none;font-size:.76rem;font-weight:800}
    .back:hover{color:#fff}
    @media(max-width:520px){body{padding:18px}.brand strong{font-size:2.8rem}.lead{font-size:.92rem}.card{padding:18px}}
  </style>
</head>
<body>
  <main>
    <div class="brand">
      <strong>REAL PLAY</strong>
      <span>BASKETBALL</span>
    </div>

    <div class="eyebrow">HEAD ADMIN</div>
    <h1>GAME CONTROL</h1>
    <p class="lead">Sign in to manage Real Play sessions, players, teams, live scoring, stats, and final results.</p>

    <section class="card">
      <form id="admin-login">
        <label>HEAD ADMIN EMAIL
          <input id="admin-email" type="email" value="jeromemirabuenos62@gmail.com" readonly autocomplete="username">
        </label>
        <label>PASSWORD
          <input id="admin-password" type="password" required autocomplete="current-password" placeholder="Enter your Real Play password">
        </label>
        <button id="admin-submit" type="submit">ENTER GAME CONTROL</button>
        <div id="admin-status" class="status" role="status" aria-live="polite"></div>
      </form>
    </section>

    <a class="back" href="./">← BACK TO REAL PLAY</a>
    <div class="foot">HEAD ADMIN ACCESS IS VERIFIED BY THE REAL PLAY BACKEND.<br>NO ADMIN PASSWORD IS STORED IN THIS PAGE.</div>
  </main>

  <script>
    (() => {
      const API_BASE_URL = 'https://api.clarapmc.com';
      const TOKEN_KEY = 'real_play_access_token';
      const form = document.getElementById('admin-login');
      const email = document.getElementById('admin-email');
      const password = document.getElementById('admin-password');
      const submit = document.getElementById('admin-submit');
      const status = document.getElementById('admin-status');

      function setStatus(message, type='') {
        status.textContent = message || '';
        status.className = `status${type ? ` ${type}` : ''}`;
      }

      async function verifyAdmin(token) {
        const response = await fetch(`${API_BASE_URL}/api/real-play/admin/career/control`, {
          headers: { Accept: 'application/json', Authorization: `Bearer ${token}` },
        });
        const data = await response.json().catch(() => ({}));
        if (!response.ok || !data?.admin) {
          throw new Error(data?.message || 'This account is not authorized as Real Play Head Admin.');
        }
        return data;
      }

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        submit.disabled = true;
        submit.textContent = 'VERIFYING…';
        setStatus('');
        try {
          const response = await fetch(`${API_BASE_URL}/api/real-play/auth/login`, {
            method: 'POST',
            headers: { Accept: 'application/json', 'Content-Type': 'application/json' },
            body: JSON.stringify({ email: email.value.trim(), password: password.value }),
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok || !data?.token) {
            throw new Error(data?.message || 'Unable to sign in.');
          }
          await verifyAdmin(data.token);
          localStorage.setItem(TOKEN_KEY, data.token);
          setStatus('Head Admin verified. Opening Game Control…', 'success');
          window.setTimeout(() => { window.location.href = './?admin=1'; }, 250);
        } catch (error) {
          localStorage.removeItem(TOKEN_KEY);
          setStatus(error.message || 'Admin login failed.', 'error');
          password.focus();
        } finally {
          submit.disabled = false;
          submit.textContent = 'ENTER GAME CONTROL';
        }
      });

      const existing = localStorage.getItem(TOKEN_KEY);
      if (existing) {
        verifyAdmin(existing)
          .then(() => setStatus('Head Admin session already active. You can sign in again or return to Real Play.', 'success'))
          .catch(() => localStorage.removeItem(TOKEN_KEY));
      }
    })();
  </script>
</body>
</html>
