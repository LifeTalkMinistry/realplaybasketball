<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#02060b" />
  <title>Full Game Data · Real Play Basketball</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,Arial,sans-serif;background:#02060b;color:#f5f8fb}
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:#02060b}
    body{overflow-x:hidden}
    button{font:inherit}
    .page{width:min(980px,100%);margin:0 auto;padding:24px clamp(14px,3.5vw,32px) 64px}
    .top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding-bottom:18px;border-bottom:1px solid rgba(120,170,198,.18)}
    .eyebrow{margin:0 0 7px;color:#45dff7;font-size:.62rem;font-weight:950;letter-spacing:.16em}
    h1,h2,h3,p{margin-top:0}
    h1{margin-bottom:5px;font-family:Impact,'Arial Narrow',Arial,sans-serif;font-size:clamp(2.15rem,7vw,4.2rem);font-style:italic;line-height:.9;letter-spacing:.02em}
    .sub{margin:0;color:#8298aa;font-size:.75rem;line-height:1.45}
    .close{flex:0 0 auto;min-height:40px;padding:0 13px;border:1px solid rgba(120,170,198,.22);border-radius:10px;background:#07111a;color:#dce8ef;font-size:.58rem;font-weight:900;letter-spacing:.08em;cursor:pointer}
    .loading,.error{margin:38px 0;padding:28px 18px;border:1px solid rgba(120,170,198,.16);border-radius:18px;background:#06101a;text-align:center;color:#94a8b7;font-size:.76rem;font-weight:800;line-height:1.55}
    .error{border-color:rgba(255,97,116,.28);color:#ffabb5;background:#16070b}
    .section{margin-top:24px}
    .section-title{display:flex;align-items:end;justify-content:space-between;gap:14px;margin-bottom:10px}
    .section-title h2{margin:0;font-family:Impact,'Arial Narrow',Arial,sans-serif;font-size:1.35rem;font-style:italic;letter-spacing:.045em}
    .section-title span{color:#60798b;font-size:.52rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase}
    .panel{border:1px solid rgba(115,168,197,.15);border-radius:16px;background:#06101a;overflow:hidden}
    .context-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
    .context-cell{min-width:0;padding:14px;border-right:1px solid rgba(115,168,197,.1);border-bottom:1px solid rgba(115,168,197,.1)}
    .context-cell:nth-child(4n){border-right:0}
    .context-cell small{display:block;margin-bottom:6px;color:#698193;font-size:.5rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase}
    .context-cell strong{display:block;overflow-wrap:anywhere;font-size:.82rem;line-height:1.25}
    .score{grid-column:span 2;background:linear-gradient(135deg,rgba(23,84,164,.18),rgba(164,37,54,.13))}
    .score strong{font-family:Impact,'Arial Narrow',Arial,sans-serif;font-size:1.5rem;font-style:italic;letter-spacing:.03em}
    .recognitions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}
    .recognition{padding:14px;border:1px solid rgba(230,191,82,.22);border-radius:14px;background:linear-gradient(155deg,rgba(76,57,8,.24),rgba(7,14,20,.92))}
    .recognition small{display:block;margin-bottom:5px;color:#d9bd66;font-size:.49rem;font-weight:950;letter-spacing:.11em}
    .recognition strong{display:block;font-size:.8rem;text-transform:uppercase}
    .recognition span{display:block;margin-top:5px;color:#8297a5;font-size:.58rem;font-weight:800}
    .none{padding:15px;color:#6f8493;font-size:.68rem}
    .team{margin-top:26px}
    .team-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;padding:0 2px}
    .team-head h2{margin:0;font-family:Impact,'Arial Narrow',Arial,sans-serif;font-size:1.55rem;font-style:italic;letter-spacing:.05em}
    .team-head span{font-size:.55rem;font-weight:950;letter-spacing:.1em;color:#718897}
    .team-west .team-head h2{color:#74b9ff}.team-east .team-head h2{color:#ff7c86}
    .players{display:grid;gap:10px}
    .player{border:1px solid rgba(111,164,191,.15);border-radius:15px;background:#06101a;overflow:hidden}
    .team-west .player{border-left:3px solid #3e8bd6}.team-east .player{border-left:3px solid #d95360}
    .player-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:13px 14px 10px;border-bottom:1px solid rgba(111,164,191,.1)}
    .identity{min-width:0}
    .identity small{display:block;margin-bottom:4px;color:#647c8d;font-size:.49rem;font-weight:900;letter-spacing:.09em}
    .identity strong{display:block;overflow-wrap:anywhere;font-size:.86rem;text-transform:uppercase}
    .badges{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:5px}
    .badge{padding:5px 7px;border:1px solid rgba(230,191,82,.2);border-radius:999px;color:#e4c967;background:rgba(87,67,15,.22);font-size:.45rem;font-weight:950;letter-spacing:.06em;white-space:nowrap}
    .stat-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-bottom:1px solid rgba(111,164,191,.1)}
    .stat{padding:11px 8px;text-align:center;border-right:1px solid rgba(111,164,191,.09)}
    .stat:last-child{border-right:0}.stat b{display:block;font-size:.9rem}.stat small{display:block;margin-top:4px;color:#657e8f;font-size:.43rem;font-weight:900;letter-spacing:.06em}
    .shot-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-bottom:1px solid rgba(111,164,191,.1)}
    .shot{padding:11px 12px;border-right:1px solid rgba(111,164,191,.09)}.shot:last-child{border-right:0}
    .shot small{display:block;color:#657e8f;font-size:.44rem;font-weight:900;letter-spacing:.08em}.shot strong{display:block;margin-top:4px;font-size:.76rem}.shot span{display:block;margin-top:3px;color:#9bb0bd;font-size:.53rem}
    .detail-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-bottom:1px solid rgba(111,164,191,.1)}
    .detail{padding:10px 12px;border-right:1px solid rgba(111,164,191,.09)}.detail:last-child{border-right:0}
    .detail small{display:block;color:#657e8f;font-size:.43rem;font-weight:900;letter-spacing:.06em}.detail strong{display:block;margin-top:4px;font-size:.68rem;overflow-wrap:anywhere}
    .rating-line{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));background:#050d14}
    .rating{padding:10px 12px;border-right:1px solid rgba(111,164,191,.08)}.rating:last-child{border-right:0}
    .rating small{display:block;color:#5f7788;font-size:.42rem;font-weight:900;letter-spacing:.06em}.rating strong{display:block;margin-top:4px;font-size:.67rem}
    .baskets{padding:10px 12px 12px}
    .baskets>small{display:block;margin-bottom:7px;color:#657e8f;font-size:.43rem;font-weight:900;letter-spacing:.08em}
    .basket-list{display:flex;flex-wrap:wrap;gap:5px}
    .basket{padding:5px 7px;border:1px solid rgba(78,196,221,.16);border-radius:8px;background:#071823;color:#a7dfe9;font-size:.48rem;font-weight:800;white-space:nowrap}
    .footer-note{margin-top:28px;padding-top:16px;border-top:1px solid rgba(111,164,191,.14);color:#617888;font-size:.56rem;line-height:1.55;text-align:center}
    @media(max-width:760px){
      .context-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.context-cell:nth-child(4n){border-right:1px solid rgba(115,168,197,.1)}.context-cell:nth-child(2n){border-right:0}
      .recognitions{grid-template-columns:1fr}
      .stat-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.stat:nth-child(4n){border-right:0}.stat:nth-child(n+5){border-top:1px solid rgba(111,164,191,.09)}
      .shot-grid{grid-template-columns:1fr}.shot{border-right:0;border-bottom:1px solid rgba(111,164,191,.09)}.shot:last-child{border-bottom:0}
      .detail-grid,.rating-line{grid-template-columns:repeat(2,minmax(0,1fr))}.detail:nth-child(2),.detail:nth-child(4),.rating:nth-child(2),.rating:nth-child(4){border-right:0}.detail:nth-child(n+3),.rating:nth-child(n+3){border-top:1px solid rgba(111,164,191,.08)}
    }
    @media(max-width:420px){.page{padding-left:10px;padding-right:10px}.top{gap:9px}.close{padding:0 9px}.context-cell{padding:11px}.player-head{padding-left:11px;padding-right:11px}.stat{padding:10px 4px}.stat b{font-size:.82rem}.rating,.detail{padding:9px 8px}}
    @media print{body{background:#fff;color:#111}.page{width:100%;padding:0}.close{display:none}.panel,.player,.recognition{break-inside:avoid;background:#fff;border-color:#bbb}.footer-note{color:#555}}
  </style>
</head>
<body>
  <main class="page">
    <header class="top">
      <div>
        <p class="eyebrow">ADMIN · READ ONLY · FINALIZED GAME</p>
        <h1>FULL GAME DATA</h1>
        <p class="sub">One continuous evidence snapshot for a single Real Play game.</p>
      </div>
      <button class="close" type="button" onclick="history.length > 1 ? history.back() : window.close()">BACK</button>
    </header>
    <div id="app" class="loading">LOADING FINALIZED GAME DATA…</div>
  </main>

  <script>
    (() => {
      const API_BASE_URL = 'https://api.clarapmc.com';
      const TOKEN_KEY = 'real_play_access_token';
      const app = document.getElementById('app');
      const esc = (value) => String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
      const num = (value) => {
        const parsed = Number(value || 0);
        return Number.isFinite(parsed) ? parsed : 0;
      };
      const present = (value) => value !== null && value !== undefined && value !== '';
      const display = (value) => present(value) ? esc(value) : '—';
      const pct = (made, attempts) => num(attempts) > 0 ? `${Math.round((num(made) / num(attempts)) * 100)}%` : '—';
      const ratio = (top, bottom) => num(bottom) > 0 ? (num(top) / num(bottom)).toFixed(2) : (num(top) > 0 ? 'NO TO' : '—');
      const ptsPerAttempt = (points, attempts) => num(attempts) > 0 ? (num(points) / num(attempts)).toFixed(2) : '—';
      const formatTime = (ms) => {
        if (!present(ms)) return '—';
        const seconds = Math.max(0, Math.floor(num(ms) / 1000));
        return `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, '0')}`;
      };
      const formatDate = (value) => {
        if (!value) return '—';
        const date = new Date(value);
        if (Number.isNaN(date.getTime())) return '—';
        return new Intl.DateTimeFormat('en-PH', {
          dateStyle: 'medium',
          timeStyle: 'short',
          timeZone: 'Asia/Manila',
        }).format(date);
      };
      const contextLabel = (value) => String(value || 'open_ranking').replaceAll('_', ' ').toUpperCase();
      const openRankLabel = (value) => Number.isSafeInteger(Number(value)) && Number(value) > 0
        ? `OPEN RANKING SESSION #${String(Number(value)).padStart(3, '0')}`
        : 'OPEN RANKING SESSION';

      function recognitionHtml(items) {
        if (!Array.isArray(items) || !items.length) return '';
        return `<div class="badges">${items.map((item) => `<span class="badge">${esc(item.title || item.type || 'RECOGNITION')}</span>`).join('')}</div>`;
      }

      function basketHtml(player) {
        const baskets = Array.isArray(player?.madeBaskets) ? player.madeBaskets : [];
        if (!baskets.length) return `<div class="baskets"><small>MADE BASKET TIMESTAMPS</small><div class="basket-list"><span class="basket">NOT RECORDED</span></div></div>`;
        return `<div class="baskets"><small>MADE BASKET TIMESTAMPS / REPLAY REFERENCES</small><div class="basket-list">${baskets.map((basket) => {
          const value = present(basket.shotValue) ? `${num(basket.shotValue)}PT` : 'MAKE';
          const at = formatTime(basket.videoTimestampMs);
          const replay = present(basket.replayStartMs) ? ` · REPLAY ${formatTime(basket.replayStartMs)}` : '';
          return `<span class="basket">${value} · ${at}${replay}</span>`;
        }).join('')}</div></div>`;
      }

      function playerHtml(player) {
        const stats = player?.stats || {};
        const current = player?.current || {};
        const record = current?.record || null;
        const rating = player?.rating || null;
        const number = present(player?.playerNumber) ? `#${num(player.playerNumber)}` : '#—';
        return `<article class="player">
          <div class="player-head">
            <div class="identity"><small>${esc(String(player?.team || '').toUpperCase())} · ${number}</small><strong>${esc(player?.playerName || 'REAL PLAY PLAYER')}</strong></div>
            ${recognitionHtml(player?.recognitions)}
          </div>
          <div class="stat-grid">
            <div class="stat"><b>${num(stats.points)}</b><small>PTS</small></div>
            <div class="stat"><b>${num(stats.assists)}</b><small>AST</small></div>
            <div class="stat"><b>${num(stats.rebounds)}</b><small>REB</small></div>
            <div class="stat"><b>${num(stats.steals)}</b><small>STL</small></div>
            <div class="stat"><b>${num(stats.blocks)}</b><small>BLK</small></div>
            <div class="stat"><b>${num(stats.turnovers)}</b><small>TO</small></div>
            <div class="stat"><b>${num(stats.fouls)}</b><small>FOUL</small></div>
          </div>
          <div class="shot-grid">
            <div class="shot"><small>FIELD GOALS</small><strong>${num(stats.madeShots)}/${num(stats.shotAttempts)} · ${pct(stats.madeShots, stats.shotAttempts)}</strong><span>${num(stats.missedShots)} misses</span></div>
            <div class="shot"><small>1PT</small><strong>${num(stats.onePtMade)}/${num(stats.onePtAttempts)} · ${pct(stats.onePtMade, stats.onePtAttempts)}</strong><span>${num(stats.onePtMiss)} misses</span></div>
            <div class="shot"><small>2PT</small><strong>${num(stats.twoPtMade)}/${num(stats.twoPtAttempts)} · ${pct(stats.twoPtMade, stats.twoPtAttempts)}</strong><span>${num(stats.twoPtMiss)} misses</span></div>
          </div>
          <div class="detail-grid">
            <div class="detail"><small>SHOT ATTEMPTS</small><strong>${num(stats.shotAttempts)}</strong></div>
            <div class="detail"><small>PTS / ATTEMPT</small><strong>${ptsPerAttempt(stats.points, stats.shotAttempts)}</strong></div>
            <div class="detail"><small>AST / TO</small><strong>${ratio(stats.assists, stats.turnovers)}</strong></div>
            <div class="detail"><small>IDENTITY</small><strong>${player?.unclaimed ? 'UNCLAIMED PLAYER' : 'REAL PLAY PLAYER'}</strong></div>
          </div>
          <div class="rating-line">
            <div class="rating"><small>CURRENT OVR</small><strong>${display(current?.ovr)}</strong></div>
            <div class="rating"><small>OFFICIAL RANK</small><strong>${present(current?.officialRank) ? `#${esc(current.officialRank)}` : '—'}</strong></div>
            <div class="rating"><small>CURRENT WIN RATE</small><strong>${record && present(record.winRate) ? `${esc(record.winRate)}% · ${num(record.wins)}-${num(record.losses)}` : '—'}</strong></div>
            <div class="rating"><small>GAME OVR CONTEXT</small><strong>${rating && (present(rating.before) || present(rating.after)) ? `${display(rating.before)} → ${display(rating.after)}` : '—'}</strong></div>
          </div>
          ${basketHtml(player)}
        </article>`;
      }

      function teamHtml(team, players) {
        const safePlayers = Array.isArray(players) ? players : [];
        return `<section class="team team-${team}"><div class="team-head"><h2>${team.toUpperCase()}</h2><span>${safePlayers.length} FINALIZED PLAYER${safePlayers.length === 1 ? '' : 'S'}</span></div><div class="players">${safePlayers.length ? safePlayers.map(playerHtml).join('') : '<div class="panel none">NO FINALIZED PLAYERS RECORDED.</div>'}</div></section>`;
      }

      function render(data) {
        const game = data?.game || {};
        const recognitions = Array.isArray(data?.recognitions) ? data.recognitions : [];
        const winner = game?.winner ? String(game.winner).toUpperCase() : '—';
        const finalScore = `WEST ${num(game.westScore)} — EAST ${num(game.eastScore)}`;
        document.title = `${game.officialGameId || openRankLabel(game.openRankNumber)} · Full Game Data`;
        app.className = '';
        app.innerHTML = `
          <section class="section">
            <div class="section-title"><h2>GAME CONTEXT</h2><span>FINALIZED SOURCE</span></div>
            <div class="panel context-grid">
              <div class="context-cell score"><small>FINAL</small><strong>${esc(finalScore)}</strong></div>
              <div class="context-cell"><small>WINNER</small><strong>${esc(winner)}</strong></div>
              <div class="context-cell"><small>STATUS</small><strong>FINALIZED</strong></div>
              <div class="context-cell"><small>OPEN RANKING SESSION</small><strong>${esc(openRankLabel(game.openRankNumber))}</strong></div>
              <div class="context-cell"><small>OFFICIAL GAME ID</small><strong>${display(game.officialGameId)}</strong></div>
              <div class="context-cell"><small>INTERNAL GAME RECORD ID</small><strong>${display(game.gameId)}</strong></div>
              <div class="context-cell"><small>COMPETITION</small><strong>${esc(contextLabel(game.competitionContext))}</strong></div>
              <div class="context-cell"><small>RULES / FORMAT</small><strong>${display(game.rulesLabel)}</strong></div>
              <div class="context-cell"><small>LOCATION</small><strong>${display(game.locationName)}</strong></div>
              <div class="context-cell"><small>START</small><strong>${esc(formatDate(game.startsAt || game.startedAt))}</strong></div>
              <div class="context-cell"><small>FINALIZED</small><strong>${esc(formatDate(game.finalizedAt))}</strong></div>
            </div>
          </section>

          <section class="section">
            <div class="section-title"><h2>OFFICIAL GAME RECOGNITIONS</h2><span>CANONICAL / SHARED MVP AUTHORITY</span></div>
            ${recognitions.length ? `<div class="recognitions">${recognitions.map((item) => `<article class="recognition"><small>${esc(item.title || item.type)}</small><strong>${esc(item.playerName || 'REAL PLAY PLAYER')}</strong><span>${esc(String(item.team || '').toUpperCase() || 'GAME')}</span></article>`).join('')}</div>` : '<div class="panel none">—</div>'}
          </section>

          ${teamHtml('west', data?.teams?.west)}
          ${teamHtml('east', data?.teams?.east)}

          <div class="footer-note">
            READ ONLY · FINALIZED GAME EVIDENCE · MISSING VALUES ARE SHOWN AS — OR NOT RECORDED.<br>
            Box-score values come from finalized player stat records. Replay timestamps are supporting event evidence. Current OVR/rank context is read from the canonical rating/ranking snapshot.<br>
            Replay-only badges such as Bucket Getter are intentionally not promoted into a second backend award authority on this page.
          </div>`;
      }

      async function load() {
        const sessionId = Number(new URLSearchParams(location.search).get('game') || 0);
        const token = localStorage.getItem(TOKEN_KEY) || '';
        if (!Number.isSafeInteger(sessionId) || sessionId < 1) {
          app.className = 'error';
          app.textContent = 'A valid finalized Game ID is required.';
          return;
        }
        if (!token || token === '__REAL_PLAY_VISITOR_REPLAY__') {
          app.className = 'error';
          app.textContent = 'Admin authentication is required to view Full Game Data.';
          return;
        }

        try {
          const response = await fetch(`${API_BASE_URL}/api/real-play/admin/games/${encodeURIComponent(sessionId)}/full-data`, {
            headers: { Accept: 'application/json', Authorization: `Bearer ${token}` },
            cache: 'no-store',
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(data?.message || data?.error || `Request failed (${response.status}).`);
          render(data);
        } catch (error) {
          app.className = 'error';
          app.textContent = error?.message || 'Unable to load finalized game data.';
        }
      }

      load();
    })();
  </script>
</body>
</html>
