name: Patch priority guide zoom

on:
  push:
    paths:
      - '.github/workflows/patch-guide-zoom.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Hide zoom UI and keep pinch zoom
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('ranking-spot-priority.js')
          text = path.read_text(encoding='utf-8')

          controls = ".rp-priority-guide-zoom-controls{\n"
          hint = ".rp-priority-guide-zoom-hint{\n"

          if controls in text and "display:none!important;" not in text.split(controls, 1)[1].split('}', 1)[0]:
              text = text.replace(controls, controls + "        display:none!important;\n", 1)

          if hint in text and "display:none!important;" not in text.split(hint, 1)[1].split('}', 1)[0]:
              text = text.replace(hint, hint + "        display:none!important;\n", 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ranking-spot-priority.js
          if git diff --cached --quiet; then
            echo "Visible zoom UI already hidden."
            exit 0
          fi
          git commit -m "Hide priority guide zoom controls"
          git push
