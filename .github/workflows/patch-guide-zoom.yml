name: Patch priority guide zoom

on:
  push:
    paths:
      - '.github/workflows/patch-guide-zoom.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch zoom support
        run: python scripts/patch-guide-zoom.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ranking-spot-priority.js
          if git diff --cached --quiet; then
            echo "Zoom patch already present."
            exit 0
          fi
          git commit -m "Add pinch zoom to priority guide"
          git push
