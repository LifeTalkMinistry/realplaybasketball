name: Apply profile startup gate hotfix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-startup-gate-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch startup gate
        shell: bash
        run: |
          python -c 'from pathlib import Path; p=Path("app.js"); s=p.read_text(); old="if (!bootResourcesReady || !initialHomeReady || !hasNewShell() || !homeVisualReady()) return false;"; new="if (!bootResourcesReady || !initialHomeReady || !initialInteractionReady || !hasNewShell() || !homeVisualReady()) return false;"; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new,1))'
          python -c 'from pathlib import Path; p=Path("app.js"); s=p.read_text(); old="    initialInteractionReady = true;\n    revealNewShell();"; new="    // Let the first-tap stack settle for a full two-frame paint before the loader releases.\n    await nextPaint();\n    initialInteractionReady = true;\n    revealNewShell();"; assert s.count(old)==1, s.count(old); p.write_text(s.replace(old,new,1))'
          python -c 'from pathlib import Path; p=Path("index.html"); s=p.read_text(); old="20261007-profile-hero-stability-v221"; new="20261007-profile-interaction-gate-v222"; assert old in s; p.write_text(s.replace(old,new))'
          rm .github/workflows/profile-startup-gate-hotfix.yml

      - name: Verify startup gate
        shell: bash
        run: |
          grep -F "!initialInteractionReady" app.js
          node --check app.js
          node --test tests/profile-hero-stability-contract.test.js

      - name: Commit hotfix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html .github/workflows/profile-startup-gate-hotfix.yml
          git commit -m "Hold boot screen until ME profile stack is ready"
          git push origin HEAD:main
