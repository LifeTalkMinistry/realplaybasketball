name: Temporary 4v4 Freeze Runtime v2

on:
  push:
    branches:
      - main

jobs:
  runtime-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check patched 4v4 files
        run: |
          node --check home-future-4v4-team-code-beta.js
          node --check home-future-4v4-card-cleanup.js
          node --check login-landing-fix.js
          node --check tests/temporary-4v4-freeze-runtime.mjs

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify deployed 4v4 freeze contract
        run: node tests/temporary-4v4-freeze-runtime.mjs
