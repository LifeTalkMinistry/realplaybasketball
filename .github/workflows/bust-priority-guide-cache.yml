name: Bust priority guide cache

on:
  push:
    paths:
      - '.github/workflows/bust-priority-guide-cache.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bump app asset cache version
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          version = '20260917-guide-clean-v80'

          app = Path('app.js')
          text = app.read_text(encoding='utf-8')
          text = text.replace("const version = '20260917-player-claim-v79';", f"const version = '{version}';", 1)
          app.write_text(text, encoding='utf-8')

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          html = html.replace('app.js?v=20260917-player-claim-v79', f'app.js?v={version}', 1)
          index.write_text(html, encoding='utf-8')
          PY

      - name: Commit cache bust
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js index.html
          if git diff --cached --quiet; then
            echo "Cache version already current."
            exit 0
          fi
          git commit -m "Force fresh priority guide assets"
          git push
