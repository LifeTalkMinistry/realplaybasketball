name: Open Rank Identity CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  identity-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check changed JavaScript syntax
        run: |
          node --check open-rank-auto-id.js
          node --check public-profile-history.js
          node --check updates-session-title-admin.js
          node --check career-game-replay.js
          node --check career-game-replay-marker-cleanup.js
          node --check real-play-inactive-player-state.js
          node --check admin-audit-team-designation.js
          node --check world-results.js
          node --check tests/inactive-player-identity-lookup.test.js
          node --check tests/world-team-identity-contract.test.js

      - name: Run Open Rank identity contract tests
        run: |
          node --test tests/open-rank-recording-authority.test.js
          node --test tests/inactive-player-identity-lookup.test.js
          node --test tests/world-team-identity-contract.test.js
