name: Open Rank Identity CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  identity-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check changed JavaScript syntax
        run: |
          node --check open-rank-auto-id.js
          node --check public-profile-history.js
          node --check updates-session-title-admin.js
          node --check career-game-replay.js
          node --check career-game-replay-marker-cleanup.js
          node --check real-play-inactive-player-state.js
          node --check admin-audit-team-designation.js
          node --check world-results.js
          node --check tests/inactive-player-identity-lookup.test.js
          node --check tests/world-team-identity-contract.test.js

      - name: Run Open Rank identity contract tests
        run: |
          node --test tests/open-rank-recording-authority.test.js
          node --test tests/inactive-player-identity-lookup.test.js
          node --test tests/world-team-identity-contract.test.js

      - name: Check Game MVP scripts and regression tests
        run: |
          node --check career-game-replay-stats.js
          node --check career-game-replay-official-mvp.js
          node --check admin-game-recap-recognitions.js
          node --check world-results.js
          node --check tests/replay-player-stats-dnp-contract.test.js

      - name: Run Game MVP regression tests
        run: node --test tests/replay-player-stats-dnp-contract.test.js

      - name: Check Tune-Up scoped player renderer syntax
        run: |
          node --check real-play-world-players.js
          node --check visitor-world-players.js
          node --check tests/tune-up-scoped-player-render-contract.test.js

      - name: Test Tune-Up ranking rows survive shared directory refresh
        run: node --test tests/tune-up-scoped-player-render-contract.test.js

      - name: Test competition player eligibility isolation
        run: |
          node --check real-play-inactive-player-state.js
          node --check real-play-world-player-filters.js
          node --check competition-hub.js
          node --check tests/competition-scoped-inactive-isolation.test.js
          node --test tests/competition-scoped-inactive-isolation.test.js

      - name: Test scoped competition CSS visibility precedence
        run: |
          node --check tests/competition-scope-display-precedence.test.js
          node --test tests/competition-scope-display-precedence.test.js
