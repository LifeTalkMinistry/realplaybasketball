name: Temporary 4v4 Eight Team Patch V2

on:
  push:
    paths:
      - '.github/workflows/temporary-4v4-eight-team-patch-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/4v4-eight-team-catalog
          fetch-depth: 0

      - name: Apply eight-team patch
        run: python scripts/temporary_patch_4v4_eight_teams.py

      - name: Syntax checks
        run: |
          node --check home-future-4v4-card-cleanup.js
          node --check home-future-4v4-team-code-beta.js
          node --check home-future-4v4-team-ovr-header.js
          node --check three-v-three-club-art.js
          node --check home-4v4-slot-picker-dynamic-v2.js
          node --check home-4v4-slot-picker.js

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temporary-4v4-eight-team-patch.yml
          git rm .github/workflows/temporary-4v4-eight-team-patch-v2.yml
          git rm scripts/temporary_patch_4v4_eight_teams.py
          git add -A
          git commit -m "Expand 4v4 catalog to eight teams"
          git push origin HEAD:feat/4v4-eight-team-catalog
