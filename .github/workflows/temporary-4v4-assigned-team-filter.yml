name: Temporary 4v4 Assigned Team Filter

on:
  push:
    branches:
      - feat/4v4-assigned-block-team-filter
    paths:
      - '.github/workflows/temporary-4v4-assigned-team-filter.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/4v4-assigned-block-team-filter
          fetch-depth: 0

      - name: Apply assigned-team filter patch
        run: python3 scripts/temporary_patch_4v4_assigned_team_filter.py

      - name: Syntax checks
        run: |
          node --check home-4v4-slot-picker-dynamic-v2.js
          node --check home-future-4v4-card-cleanup.js
          node --check home-4v4-slot-picker.js

      - name: Commit patch and remove temporary runner
        run: |
          git rm .github/workflows/temporary-4v4-assigned-team-filter.yml
          git rm scripts/temporary_patch_4v4_assigned_team_filter.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home-4v4-slot-picker-dynamic-v2.js home-future-4v4-card-cleanup.js home-4v4-slot-picker.js index.html
          git commit -m "Filter 4v4 clubs by assigned time block"
          git push
