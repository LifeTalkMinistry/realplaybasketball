name: Temporary 4v4 Slot Handoff Live

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  live-slot-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check
        run: node --check tests/temporary-4v4-slot-handoff-live.mjs

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify live slot handoff
        run: node tests/temporary-4v4-slot-handoff-live.mjs
