name: Temporary Admin 4v4 Team Management v144

on:
  push:
    branches:
      - fix/admin-4v4-team-management-v144

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-4v4-team-management-v144

      - name: Wire admin 4v4 team manager into production loader
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app.js')
          text = path.read_text()
          old = "      'real-play-world-player-admin-identity.js',\n      'real-play-player-claim.js',"
          new = "      'real-play-world-player-admin-identity.js',\n      'admin-player-schedule.js',\n      'real-play-player-claim.js',"
          if text.count(old) != 1:
              raise SystemExit(f'Expected one admin loader insertion point, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))

          path = Path('index.html')
          text = path.read_text()
          old = 'data-rp-deploy="20260930-team-cap-home-availability-v143"'
          new = 'data-rp-deploy="20260930-admin-4v4-team-management-v144"'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one deploy id, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Verify exact frontend wiring
        run: |
          node --check app.js
          node --check admin-player-schedule.js
          grep -F "'admin-player-schedule.js'" app.js
          grep -F 'data-rp-deploy="20260930-admin-4v4-team-management-v144"' index.html
          grep -F 'MANAGE 4V4 TEAM' admin-player-schedule.js
          grep -F 'data-admin-4v4-club' admin-player-schedule.js
          git diff --check
          git diff -- app.js index.html

      - name: Commit wiring
        run: |
          git config user.name "LifeTalk Ministry"
          git config user.email "96472293+LifeTalkMinistry@users.noreply.github.com"
          git add app.js index.html
          git commit -m "Load admin 4v4 team manager"
          git push origin HEAD:fix/admin-4v4-team-management-v144
