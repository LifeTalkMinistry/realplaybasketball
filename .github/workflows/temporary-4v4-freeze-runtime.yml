name: Temporary 4v4 Freeze Runtime

on:
  push:
    branches:
      - main

jobs:
  runtime-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check patched 4v4 files
        run: |
          node --check home-future-4v4-team-code-beta.js
          node --check home-future-4v4-card-cleanup.js
          node --check login-landing-fix.js

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Verify deployed 4v4 freeze contract
        env:
          REALPLAY_URL: https://joinrealplay.com/
        run: |
          cat > /tmp/verify-4v4.mjs <<'EOF'
          import assert from 'node:assert/strict';
          import { chromium } from 'playwright';

          const APP_URL = process.env.REALPLAY_URL;
          const DEPLOY_ID = '20260929-4v4-main-thread-freeze-v135';
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          const browser = await chromium.launch({ headless: true });
          const context = await browser.newContext({ viewport: { width: 390, height: 844 } });
          const requests = [];
          const clubs = ['lions', 'valiant', 'watchmen', 'conquerors'];
          let mockState = {
            ok: true,
            userId: 900001,
            playerName: 'RUNTIME TEST PLAYER',
            clubs,
            joinedClub: null,
            joinedAt: null,
            preferredClub: null,
            preferenceUpdatedAt: null,
            preferencePlayers: [],
            teamStates: clubs.map((club) => ({ club, status: 'available', memberCount: 0, capacity: 4, expiresAt: null, securedAt: null })),
            formationState: 'team_code',
            rosterLocked: false,
          };

          const corsHeaders = {
            'access-control-allow-origin': '*',
            'access-control-allow-headers': 'authorization,content-type',
            'access-control-allow-methods': 'GET,POST,PUT,DELETE,OPTIONS',
            'content-type': 'application/json',
          };

          function cloneState(extra = {}) {
            return JSON.parse(JSON.stringify({ ...mockState, ...extra }));
          }

          function team(club) {
            return mockState.teamStates.find((item) => item.club === club);
          }

          function count(path, method = null) {
            return requests.filter((item) => item.path === path && (!method || item.method === method)).length;
          }

          await context.route('https://api.clarapmc.com/api/real-play/4v4/**', async (route) => {
            const request = route.request();
            const url = new URL(request.url());
            const method = request.method();
            requests.push({ method, path: url.pathname, at: Date.now() });

            if (method === 'OPTIONS') {
              await route.fulfill({ status: 204, headers: corsHeaders, body: '' });
              return;
            }

            if (url.pathname === '/api/real-play/4v4/me' && method === 'GET') {
              await route.fulfill({ status: 200, headers: corsHeaders, body: JSON.stringify(cloneState()) });
              return;
            }

            if (url.pathname === '/api/real-play/4v4/join' && method === 'POST') {
              const body = request.postDataJSON();
              const club = String(body?.club || 'lions').toLowerCase();
              const current = team(club);
              current.status = 'held';
              current.memberCount = 2;
              current.expiresAt = '2026-09-30T22:00:00.000Z';
              mockState.joinedClub = club;
              mockState.preferredClub = club;
              mockState.joinedAt = '2026-09-29T22:00:00.000Z';
              mockState.preferencePlayers = [
                { userId: 900001, playerName: 'RUNTIME TEST PLAYER', preferredClub: club, rank: 1, ovr: 81, verifiedGames: 10, record: { wins: 6, losses: 4, games: 10 }, winRate: 60, topStats: [{ key: 'PTS', value: 4.2 }] },
                { userId: 900002, playerName: 'TEAMMATE', preferredClub: club, rank: 2, ovr: 79, verifiedGames: 10, record: { wins: 5, losses: 5, games: 10 }, winRate: 50, topStats: [{ key: 'REB', value: 3.1 }] },
              ];
              await route.fulfill({ status: 200, headers: corsHeaders, body: JSON.stringify(cloneState({ message: 'Joined forming team.' })) });
              return;
            }

            if (url.pathname === '/api/real-play/4v4/preference' && method === 'DELETE') {
              const club = mockState.joinedClub || 'lions';
              const current = team(club);
              current.status = 'held';
              current.memberCount = 1;
              mockState.joinedClub = null;
              mockState.preferredClub = null;
              mockState.joinedAt = null;
              mockState.preferencePlayers = mockState.preferencePlayers.filter((player) => player.userId !== 900001);
              await route.fulfill({ status: 200, headers: corsHeaders, body: JSON.stringify(cloneState({ message: 'Left forming team.' })) });
              return;
            }

            if (url.pathname === '/api/real-play/4v4/admin/code' && method === 'POST') {
              const body = request.postDataJSON();
              const club = String(body?.club || 'lions').toLowerCase();
              const current = team(club);
              if (current.status === 'available') {
                current.status = 'held';
                current.expiresAt = '2026-09-30T22:00:00.000Z';
              }
              await route.fulfill({
                status: 200,
                headers: corsHeaders,
                body: JSON.stringify({
                  ok: true,
                  club,
                  code: 'RP-TEST1',
                  status: current.status,
                  memberCount: current.memberCount,
                  capacity: 4,
                  expiresAt: current.expiresAt,
                  securedAt: current.securedAt,
                }),
              });
              return;
            }

            await route.fulfill({ status: 404, headers: corsHeaders, body: JSON.stringify({ message: 'Unhandled runtime test route.' }) });
          });

          const page = await context.newPage();
          const consoleErrors = [];
          page.on('pageerror', (error) => consoleErrors.push(`pageerror: ${error.message}`));
          page.on('console', (message) => {
            if (message.type() === 'error') consoleErrors.push(`console: ${message.text()}`);
          });

          await page.addInitScript(() => {
            window.__rpRuntimeLongTasks = [];
            try {
              const observer = new PerformanceObserver((list) => {
                for (const entry of list.getEntries()) window.__rpRuntimeLongTasks.push(entry.duration);
              });
              observer.observe({ type: 'longtask', buffered: true });
            } catch (_error) {}
          });

          await page.goto(APP_URL, { waitUntil: 'domcontentloaded', timeout: 45000 });
          await page.waitForFunction((deploy) => document.documentElement?.dataset?.rpDeploy === deploy, DEPLOY_ID, { timeout: 30000 });
          await page.waitForSelector('.rp-home-4v4-explore', { state: 'attached', timeout: 30000 });

          // A. HOME IDLE: Team Code remains lazy and there are no 4v4 state requests.
          const homeMeBefore = count('/api/real-play/4v4/me', 'GET');
          await sleep(30000);
          assert.equal(count('/api/real-play/4v4/me', 'GET'), homeMeBefore, 'Home idle must not request 4v4 state.');
          assert.equal(await page.locator('script[src*="home-future-4v4-team-code-beta.js"]').count(), 0, 'Team Code Beta must remain lazy before opening 4v4.');

          // Add a fake token only after startup so unrelated auth guards cannot consume it.
          await page.evaluate(() => localStorage.setItem('real_play_access_token', 'runtime-test-token'));

          // B. OPEN 4V4: one script, one initial GET, stable UI.
          await page.locator('.rp-home-4v4-explore').first().evaluate((element) => element.click());
          await page.waitForFunction(() => window.__realPlay4v4TeamCodeBetaInstalled === true, null, { timeout: 15000 });
          await page.waitForSelector('[data-rp-4v4-static-view].open', { timeout: 10000 });
          await page.waitForTimeout(600);
          assert.equal(await page.locator('script[src*="home-future-4v4-team-code-beta.js"]').count(), 1, 'Exactly one Team Code Beta script tag is allowed.');
          assert.equal(count('/api/real-play/4v4/me', 'GET'), homeMeBefore + 1, 'Opening 4v4 must perform exactly one state GET.');
          assert.match(await page.locator('[data-rp-4v4-preference-action]').textContent(), /JOIN MY TEAM|JOINED|TEAM SECURED|MY TEAM/);

          // C. 4V4 IDLE: no repeated GETs and browser stays responsive.
          const idleMeBefore = count('/api/real-play/4v4/me', 'GET');
          await page.evaluate(() => { window.__rpRuntimeLongTasks = []; });
          await sleep(60000);
          assert.equal(count('/api/real-play/4v4/me', 'GET'), idleMeBefore, '4v4 idle must not repeat GET /4v4/me.');
          assert.equal(await page.locator('[data-rp-4v4-static-view].open').count(), 1, '4v4 view must remain responsive after idle.');
          const longTasks = await page.evaluate(() => window.__rpRuntimeLongTasks || []);
          const maxLongTask = longTasks.length ? Math.max(...longTasks) : 0;
          assert.ok(maxLongTask < 2000, `Unexpected main-thread long task: ${maxLongTask}ms`);

          // D. CLUB SWITCHING: visual-only, no state GET and no old/new text fight.
          const switchMeBefore = count('/api/real-play/4v4/me', 'GET');
          for (let index = 0; index < 4; index += 1) {
            await page.locator('[data-rp-4v4-next]').click();
            await page.waitForTimeout(80);
          }
          assert.equal(count('/api/real-play/4v4/me', 'GET'), switchMeBefore, 'Club switching must not fetch state.');
          const switchText = await page.locator('[data-rp-4v4-preference-action]').textContent();
          assert.ok(!/^I PREFER/i.test(String(switchText || '').trim()), `Legacy preference text took control: ${switchText}`);
          await sleep(15000);
          assert.equal(await page.locator('[data-rp-4v4-preference-action]').textContent(), switchText, 'Team Code action text must stay stable after club switch.');
          assert.equal(count('/api/real-play/4v4/me', 'GET'), switchMeBefore, 'Club switch idle must not fetch state.');

          // E. CLOSE 4V4: no continued GETs while hidden.
          await page.locator('[data-rp-4v4-static-back]').click();
          await page.waitForFunction(() => !document.querySelector('[data-rp-4v4-static-view]')?.classList.contains('open'));
          const closedMeBefore = count('/api/real-play/4v4/me', 'GET');
          await sleep(30000);
          assert.equal(count('/api/real-play/4v4/me', 'GET'), closedMeBefore, 'Closing 4v4 must stop 4v4 state traffic.');

          // F. REOPEN 10X: one explicit refresh per open, no script/listener multiplication.
          for (let index = 0; index < 10; index += 1) {
            const beforeOpen = count('/api/real-play/4v4/me', 'GET');
            await page.locator('.rp-home-4v4-explore').first().evaluate((element) => element.click());
            await page.waitForSelector('[data-rp-4v4-static-view].open');
            await page.waitForTimeout(180);
            assert.equal(count('/api/real-play/4v4/me', 'GET'), beforeOpen + 1, `Reopen ${index + 1} must perform one state refresh.`);
            assert.equal(await page.locator('script[src*="home-future-4v4-team-code-beta.js"]').count(), 1, `Reopen ${index + 1} duplicated Team Code script.`);
            await page.locator('[data-rp-4v4-static-back]').click();
            await page.waitForFunction(() => !document.querySelector('[data-rp-4v4-static-view]')?.classList.contains('open'));
          }

          // Open once for remaining tests.
          await page.locator('.rp-home-4v4-explore').first().evaluate((element) => element.click());
          await page.waitForSelector('[data-rp-4v4-static-view].open');
          await page.waitForTimeout(180);

          // G. FOCUS: exactly one legitimate refresh open; none when closed.
          const focusOpenBefore = count('/api/real-play/4v4/me', 'GET');
          await page.evaluate(() => window.dispatchEvent(new Event('focus')));
          await page.waitForTimeout(180);
          assert.equal(count('/api/real-play/4v4/me', 'GET'), focusOpenBefore + 1, 'Focus while open must cause one refresh.');
          await page.locator('[data-rp-4v4-static-back]').click();
          const focusClosedBefore = count('/api/real-play/4v4/me', 'GET');
          await page.evaluate(() => window.dispatchEvent(new Event('focus')));
          await page.waitForTimeout(180);
          assert.equal(count('/api/real-play/4v4/me', 'GET'), focusClosedBefore, 'Focus while closed must not refresh 4v4 state.');
          await page.locator('.rp-home-4v4-explore').first().evaluate((element) => element.click());
          await page.waitForSelector('[data-rp-4v4-static-view].open');
          await page.waitForTimeout(180);

          // H. JOIN: one POST, no extra GET storm, held state visible.
          const joinPostBefore = count('/api/real-play/4v4/join', 'POST');
          const joinMeBefore = count('/api/real-play/4v4/me', 'GET');
          await page.locator('[data-rp-4v4-preference-action]').click();
          await page.locator('[data-rp-4v4-code-input]').fill('RP-TEST1');
          await page.locator('[data-rp-4v4-code-submit]').click();
          await page.waitForFunction(() => /JOINED/.test(document.querySelector('[data-rp-4v4-preference-action]')?.textContent || ''));
          assert.equal(count('/api/real-play/4v4/join', 'POST'), joinPostBefore + 1, 'Join must send exactly one POST.');
          assert.equal(count('/api/real-play/4v4/me', 'GET'), joinMeBefore, 'Join response must render without an extra GET.');
          assert.match(await page.locator('.rp-4v4-preference-note').textContent(), /24-HOUR HOLD ACTIVE/);
          assert.match(await page.locator('[data-rp-4v4-preference-count]').textContent(), /2\/4/);
          await sleep(5000);
          assert.equal(count('/api/real-play/4v4/me', 'GET'), joinMeBefore, 'Join must not start background GETs.');

          // I. LEAVE: one DELETE, no extra GET storm.
          const leaveBefore = count('/api/real-play/4v4/preference', 'DELETE');
          const leaveMeBefore = count('/api/real-play/4v4/me', 'GET');
          await page.locator('[data-rp-4v4-preference-cancel]').click();
          await page.waitForFunction(() => /JOIN MY TEAM/.test(document.querySelector('[data-rp-4v4-preference-action]')?.textContent || ''));
          assert.equal(count('/api/real-play/4v4/preference', 'DELETE'), leaveBefore + 1, 'Leave must send exactly one DELETE.');
          assert.equal(count('/api/real-play/4v4/me', 'GET'), leaveMeBefore, 'Leave response must render without an extra GET.');
          await sleep(3000);
          assert.equal(count('/api/real-play/4v4/me', 'GET'), leaveMeBefore, 'Leave must not start background GETs.');

          // Secured 4/4 state through one explicit lifecycle refresh.
          const activeClub = await page.evaluate(() => document.querySelector('[data-rp-4v4-static-view]')?.dataset?.rpActiveClub || 'lions');
          const secured = team(activeClub);
          secured.status = 'secured';
          secured.memberCount = 4;
          secured.securedAt = '2026-09-29T23:00:00.000Z';
          secured.expiresAt = null;
          const securedBefore = count('/api/real-play/4v4/me', 'GET');
          await page.locator('[data-rp-4v4-static-back]').click();
          await page.locator('.rp-home-4v4-explore').first().evaluate((element) => element.click());
          await page.waitForSelector('[data-rp-4v4-static-view].open');
          await page.waitForTimeout(180);
          assert.equal(count('/api/real-play/4v4/me', 'GET'), securedBefore + 1, 'Secured-state reopen must perform one lifecycle refresh.');
          assert.match(await page.locator('[data-rp-4v4-preference-action]').textContent(), /TEAM SECURED|MY TEAM · SECURED/);
          assert.match(await page.locator('.rp-4v4-preference-note').textContent(), /LINEUP LOCKED · 4\/4 CONFIRMED/);

          // J. ADMIN: one POST and one explicit refresh only.
          await page.evaluate(() => {
            window.__realPlayAdminVerified = true;
            window.dispatchEvent(new CustomEvent('realplay:admin-render'));
          });
          await page.waitForSelector('[data-rp-4v4-team-code-admin]:not([hidden])');
          const adminPostBefore = count('/api/real-play/4v4/admin/code', 'POST');
          const adminMeBefore = count('/api/real-play/4v4/me', 'GET');
          await page.locator('[data-rp-4v4-team-code-admin]').click();
          await page.waitForSelector('[data-rp-4v4-team-code-dialog]:not([hidden])');
          assert.equal(count('/api/real-play/4v4/admin/code', 'POST'), adminPostBefore + 1, 'Admin code must send one POST.');
          assert.equal(count('/api/real-play/4v4/me', 'GET'), adminMeBefore + 1, 'Admin code success must do one explicit state refresh.');
          await page.locator('[data-rp-4v4-code-close]').click();
          await sleep(3000);
          assert.equal(count('/api/real-play/4v4/me', 'GET'), adminMeBefore + 1, 'Admin flow must not start repeated GETs.');

          // Script, navigation, and final responsiveness checks.
          assert.equal(await page.locator('script[src*="home-future-4v4-team-code-beta.js"]').count(), 1, 'Final Team Code script count must remain exactly one.');
          await page.locator('[data-rp-4v4-static-back]').click();
          assert.equal(await page.evaluate(() => document.body.classList.contains('rp-4v4-static-open')), false, 'Closing 4v4 must restore Home shell state.');
          assert.ok(await page.locator('.rp-simple-nav').count(), 'Home/simple navigation must remain mounted.');
          assert.equal(consoleErrors.filter((entry) => /Maximum call stack|out of memory|unresponsive|MutationObserver/i.test(entry)).length, 0, `Freeze-related console errors: ${consoleErrors.join(' | ')}`);

          console.log(JSON.stringify({
            deploy: DEPLOY_ID,
            homeIdle4v4MeRequests: homeMeBefore,
            repeated4v4IdleRequestsPerMinute: count('/api/real-play/4v4/me', 'GET') - count('/api/real-play/4v4/me', 'GET'),
            teamCodeScriptTags: await page.locator('script[src*="home-future-4v4-team-code-beta.js"]').count(),
            maxIdleLongTaskMs: Math.round(maxLongTask * 10) / 10,
            total4v4StateGets: count('/api/real-play/4v4/me', 'GET'),
            joinPosts: count('/api/real-play/4v4/join', 'POST'),
            leaveDeletes: count('/api/real-play/4v4/preference', 'DELETE'),
            adminPosts: count('/api/real-play/4v4/admin/code', 'POST'),
            result: 'PASS',
          }, null, 2));

          await browser.close();
          EOF

          node /tmp/verify-4v4.mjs
