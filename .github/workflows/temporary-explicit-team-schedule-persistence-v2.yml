name: Temporary Explicit Team Schedule Persistence V2

on:
  push:
    branches:
      - fix/4v4-persist-assigned-team-schedule
    paths:
      - '.github/workflows/temporary-explicit-team-schedule-persistence-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/4v4-persist-assigned-team-schedule
          fetch-depth: 0

      - name: Apply persistence fix
        run: python3 scripts/temporary_patch_4v4_team_schedule_persistence.py

      - name: Syntax checks
        run: |
          node --check home-open-rank-admin-edit.js
          node --check home-open-rank-team-scheduling-v3.js
          node --check home-open-rank-team-scheduling.js
          grep -q "metadata: { teamSchedule }" home-open-rank-admin-edit.js
          grep -q "__realPlayHomeTeamScheduling" home-open-rank-team-scheduling-v3.js
          grep -q "team-metadata-persistence-v152" index.html

      - name: Commit patch and remove temporary runner
        run: |
          git rm .github/workflows/temporary-explicit-team-schedule-persistence.yml
          git rm .github/workflows/temporary-explicit-team-schedule-persistence-v2.yml
          git rm scripts/temporary_patch_4v4_team_schedule_persistence.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home-open-rank-admin-edit.js home-open-rank-team-scheduling-v3.js home-open-rank-team-scheduling.js index.html
          git add -u
          git commit -m "Persist assigned teams explicitly with Home schedule"
          git push
