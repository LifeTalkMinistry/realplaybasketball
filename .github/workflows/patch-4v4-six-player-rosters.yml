name: Patch 4v4 six-player rosters

on:
  push:
    paths:
      - '.github/workflows/patch-4v4-six-player-rosters.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update team-code UI and runtime contract to six-player rosters
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ui = Path('home-future-4v4-team-code-beta.js')
          text = ui.read_text(encoding='utf-8')
          replacements = {
              "{ status: 'available', memberCount: 0, capacity: 4 }": "{ status: 'available', memberCount: 0, capacity: 6 }",
              "LINEUP LOCKED · 4/4 CONFIRMED": "ROSTER LOCKED · 6/6 CONFIRMED",
              "${team.memberCount || 0}/4": "${team.memberCount || 0}/6",
              "${ui.team.memberCount || 0}/4": "${ui.team.memberCount || 0}/6",
              "Four players using the same active code will secure this team.": "Six roster players using the same active code will secure this team.",
              "Their four players must use this same code on": "Their six roster players must use this same code on",
              "'4/4 LINEUP LOCKED'": "'6/6 ROSTER LOCKED'",
              "This team is already secured by four players.": "This team is already secured by six roster players.",
          }
          for old, new in replacements.items():
              if old not in text:
                  print(f'warning: expected UI text not found: {old}')
              text = text.replace(old, new)
          ui.write_text(text, encoding='utf-8')

          test = Path('tests/temporary-4v4-freeze-runtime.mjs')
          test_text = test.read_text(encoding='utf-8')
          test_replacements = {
              "memberCount: 0, capacity: 4": "memberCount: 0, capacity: 6",
              "'2/4'": "'2/6'",
              "// 4/4 secured state through one explicit reopen refresh.": "// 6/6 secured state through one explicit reopen refresh.",
              "status: 'secured', memberCount: 4": "status: 'secured', memberCount: 6",
              "/LINEUP LOCKED · 4\\/4 CONFIRMED/": "/ROSTER LOCKED · 6\\/6 CONFIRMED/",
          }
          for old, new in test_replacements.items():
              if old not in test_text:
                  print(f'warning: expected runtime-contract text not found: {old}')
              test_text = test_text.replace(old, new)
          test.write_text(test_text, encoding='utf-8')
          PY

          node --check home-future-4v4-team-code-beta.js
          node --check tests/temporary-4v4-freeze-runtime.mjs

      - name: Commit frontend roster-capacity patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add home-future-4v4-team-code-beta.js tests/temporary-4v4-freeze-runtime.mjs
          if git diff --cached --quiet; then
            echo "Six-player roster patch already applied."
            exit 0
          fi
          git commit -m "Show six-player Real Play team rosters"
          git push
