name: Temporary Home Card Editable Title v142

on:
  push:
    branches:
      - fix/home-card-editable-title-v142

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/home-card-editable-title-v142

      - name: Fix Home card editable title classification
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('home-open-rank-admin-edit.js')
          text = path.read_text()

          old_gate = "    if (scheduleType(update) !== 'open-rank') return false;\n"
          if text.count(old_gate) != 1:
              raise SystemExit(f'Expected exactly one title-dependent manual override gate, found {text.count(old_gate)}')
          text = text.replace(old_gate, '', 1)

          old_shape = "    return /\\bPLAYER\\s+CAP\\b/i.test(String(update.body || ''));"
          new_shape = "    return /^\\s*ENDS\\s+.+?\\s*·\\s*\\d{1,3}\\s+PLAYER\\s+CAP\\s*$/i.test(String(update.body || ''));"
          if text.count(old_shape) != 1:
              raise SystemExit(f'Expected exactly one manual override body test, found {text.count(old_shape)}')
          text = text.replace(old_shape, new_shape, 1)

          old_filter = ".filter((item) => item?.category === 'schedule' && scheduleType(item) === 'open-rank')"
          new_filter = ".filter((item) => item?.category === 'schedule' && (isManualHomeOverride(item) || scheduleType(item) === 'open-rank'))"
          if text.count(old_filter) != 1:
              raise SystemExit(f'Expected exactly one schedule candidate filter, found {text.count(old_filter)}')
          text = text.replace(old_filter, new_filter, 1)
          path.write_text(text)

          path = Path('public-first-entry.js')
          text = path.read_text()
          old = "home-open-rank-admin-edit.js?v=20260920-home-live-spots-single-writer-v2"
          new = "home-open-rank-admin-edit.js?v=20260930-home-card-editable-title-v142"
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one Home schedule loader version, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))

          path = Path('index.html')
          text = path.read_text()
          old = 'data-rp-deploy="20260930-4v4-control-wiring-v141"'
          new = 'data-rp-deploy="20260930-home-card-editable-title-v142"'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one deploy id, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Verify exact fix
        run: |
          node --check home-open-rank-admin-edit.js
          node --check public-first-entry.js
          grep -F "isManualHomeOverride(item) || scheduleType(item) === 'open-rank'" home-open-rank-admin-edit.js
          grep -F "ENDS\\s+.+?" home-open-rank-admin-edit.js
          grep -F "20260930-home-card-editable-title-v142" public-first-entry.js
          grep -F 'data-rp-deploy="20260930-home-card-editable-title-v142"' index.html
          git diff --check
          git diff -- home-open-rank-admin-edit.js public-first-entry.js index.html

      - name: Commit fix
        run: |
          git config user.name "LifeTalk Ministry"
          git config user.email "96472293+LifeTalkMinistry@users.noreply.github.com"
          git add home-open-rank-admin-edit.js public-first-entry.js index.html
          git commit -m "Allow custom Home schedule titles"
          git push origin HEAD:fix/home-card-editable-title-v142
