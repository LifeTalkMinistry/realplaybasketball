name: Temporary 4v4 Live Asset Check

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  asset-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect live 4v4 assets
        shell: bash
        run: |
          set -euo pipefail
          CB="$(date +%s)"
          DEPLOY="20260930-home-team-time-blocks-v149"
          curl -fsSL --retry 3 "https://joinrealplay.com/?cb=${CB}" -o /tmp/rp-index.html
          echo '--- LIVE INDEX SLOT SCRIPT ---'
          grep -o 'home-4v4-slot-picker.js[^"<]*' /tmp/rp-index.html || true
          echo '--- LIVE DEPLOY ID ---'
          grep -o 'data-rp-deploy="[^"]*"' /tmp/rp-index.html | head -1 || true

          echo '--- AUDIT START AUTHORITY LIVE CHECK ---'
          curl -fsSL --retry 3 "https://joinrealplay.com/admin-recorded-start-submit-fix.js?cb=${CB}" -o /tmp/rp-audit-start.js
          curl -fsSL --retry 3 "https://joinrealplay.com/admin-courtside-live.js?cb=${CB}" -o /tmp/rp-audit-bridge.js
          node --check /tmp/rp-audit-start.js
          node --check /tmp/rp-audit-bridge.js
          grep -n "standalone Audit start endpoint owns the canonical roster validation" /tmp/rp-audit-start.js
          if grep -n "counts.west !== expected || counts.east !== expected" /tmp/rp-audit-start.js; then
            echo 'ERROR: live Audit START still contains the retired exact-roster validator.'
            exit 1
          fi
          if grep -n 'needs exactly ${expected} West and ${expected} East players' /tmp/rp-audit-start.js; then
            echo 'ERROR: live Audit START still serves the retired exact-count error text.'
            exit 1
          fi
          grep -n "CAREER_CONTROL_PATH = '/api/real-play/admin/career/control'" /tmp/rp-audit-bridge.js
          grep -n "AUDIT_CONTROL_PATH = '/api/real-play/admin/audit/control'" /tmp/rp-audit-bridge.js
          grep -n "url.pathname = AUDIT_CONTROL_PATH" /tmp/rp-audit-bridge.js
          echo '--- AUDIT LIVE ASSET SHA256 ---'
          sha256sum /tmp/rp-audit-start.js /tmp/rp-audit-bridge.js

          curl -fsSL --retry 3 "https://joinrealplay.com/home-4v4-slot-picker.js?cb=${CB}" -o /tmp/rp-slot.js
          echo '--- SLOT ID READ ---'
          grep -n "getAttribute('data-rp-4v4-slot')" /tmp/rp-slot.js || true
          echo '--- RUNTIME REQUEST FUNCTION ---'
          grep -n 'requestCurrentFourVFourRuntime' /tmp/rp-slot.js || true
          echo '--- SLOT HANDOFF ---'
          grep -n 'rpSlotHandoff' /tmp/rp-slot.js || true

          curl -fsSL --retry 3 "https://joinrealplay.com/home-future-4v4-card-cleanup.js?cb=${CB}" -o /tmp/rp-cleanup-fresh.js
          curl -fsSL --retry 3 "https://joinrealplay.com/home-future-4v4-card-cleanup.js?v=${DEPLOY}" -o /tmp/rp-cleanup-versioned.js
          echo '--- CLEANUP FRESH/VERSIONED SHA256 ---'
          sha256sum /tmp/rp-cleanup-fresh.js /tmp/rp-cleanup-versioned.js
          echo '--- VERSIONED CLEANUP OPEN CHAIN ---'
          grep -n -E '__realPlayFuture4v4CardCleanupInstalled|function openView|rp-home-4v4-explore|rp-4v4-static-open' /tmp/rp-cleanup-versioned.js | tail -24 || true
          echo '--- VERSIONED CLEANUP RESPONSE HEADERS ---'
          curl -fsSI --retry 3 "https://joinrealplay.com/home-future-4v4-card-cleanup.js?v=${DEPLOY}" | grep -iE '^(cache-control|age|etag|last-modified|x-cache|via|date):' || true
