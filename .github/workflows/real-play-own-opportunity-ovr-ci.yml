name: Real Play Personal OVR CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'ovr-simulator.html'
      - 'real-play-rank-explainer.js'
      - 'tests/scoring-first-ovr-simulator.test.js'
      - '.github/workflows/real-play-own-opportunity-ovr-ci.yml'
  push:
    branches: [main]
    paths:
      - 'ovr-simulator.html'
      - 'real-play-rank-explainer.js'
      - 'tests/scoring-first-ovr-simulator.test.js'
      - '.github/workflows/real-play-own-opportunity-ovr-ci.yml'

jobs:
  personal-ovr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check personal OVR JS syntax
        run: |
          node --check real-play-rank-explainer.js
          node --check tests/scoring-first-ovr-simulator.test.js
          node -e "const fs=require('fs'); const html=fs.readFileSync('ovr-simulator.html','utf8'); for(const m of html.matchAll(/<script[^>]*>([\s\S]*?)<\\/script>/g)){ new Function(m[1]); }"
      - name: Verify V8 simulator and zero teammate stat inputs
        run: node --test tests/scoring-first-ovr-simulator.test.js
